creation_rules:
  # suffix matches against modules/aspects/
  - path_regex: hosts/pc/secrets.yaml$
    key_groups:
      - age:
          - *pc
          - *yubikey-a
          - *yubikey-b
  - path_regex: hosts/laptop/secrets.yaml$
    key_groups:
      - age:
          - *laptop
          - *yubikey-a
          - *yubikey-b
  # what both hosts read
  - path_regex: features/secrets/shared.yaml$
    key_groups:
      - age:
          - *pc
          - *laptop
          - *yubikey-a
          - *yubikey-b
