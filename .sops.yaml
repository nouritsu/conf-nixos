keys:
  - &pc age1wygzuq7267u5mmrlc482fsfrdfd77jc0y3gs53v0jz04069gmesqq6waee
  - &laptop age1q6pjxqhkml9kvxunkgramqm9mpz6274v880qfsrqvyy78naradaqtlzcc4
creation_rules:
  # suffix matches against modules/aspects/
  - path_regex: hosts/pc/secrets.yaml$
    key_groups:
      - age:
          - *pc
          - *laptop
  - path_regex: hosts/laptop/secrets.yaml$
    key_groups:
      - age:
          - *laptop
          - *pc
  # what both hosts read
  - path_regex: features/secrets/shared.yaml$
    key_groups:
      - age:
          - *pc
          - *laptop
