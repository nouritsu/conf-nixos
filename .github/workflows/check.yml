name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    name: eval and format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      # not `nix flake check --no-build`: on a cold store it fails on
      # filtered sources like yazi's ("path ... is not valid")
      - name: evaluate every flake output
        run: |
          nix eval --json --show-trace .#nixosConfigurations \
            --apply 'builtins.mapAttrs (_: c: c.config.system.build.toplevel.drvPath)'
          nix eval --json --show-trace .#packages.x86_64-linux \
            --apply 'builtins.mapAttrs (_: p: p.drvPath)'

      - name: check formatting and dead code
        run: nix build --no-link .#checks.x86_64-linux.treefmt
