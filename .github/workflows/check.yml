# Evaluates every flake output without realising any of it. The pc closure is
# 40 GiB across 4229 paths, so a hosted runner could never build this config —
# but it can prove the config still evaluates, which is what actually breaks
# after a lock bump or an aspect rename.
name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    name: eval and format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The hosts run nix.package from the pinned nixpkgs and this action
      # installs the same lineage, so an evaluation difference surfaces here
      # rather than at switch time. It also sets experimental-features and an
      # access-tokens entry for github.com, which keeps cold input fetches off
      # the anonymous rate limit.
      - uses: cachix/install-nix-action@v31

      # `nix flake check --no-build` reads as the obvious tool here and is the
      # wrong one. --no-build declines to realise anything, but forcing a
      # package whose source is filtered -- yazi strips its markdown before
      # building -- has to materialise that tree to read its Cargo.lock. On a
      # warm store the path is already present and it passes; on a cold runner
      # it fails with "path ... is not valid". That is why this ran green
      # locally and red on the first push. nix eval carries no such
      # restriction.
      #
      # Forcing a drvPath is the same gate: it evaluates the whole module
      # system and every package. checks are config.packages (modules/flake/
      # checks.nix), so the second command covers them too, and both are
      # written generically so a new host or package is picked up without
      # touching this file.
      #
      # Warnings are expected and must not fail the run: the options.json one
      # comes from home-manager upstream.
      - name: evaluate every flake output
        run: |
          nix eval --json --show-trace .#nixosConfigurations \
            --apply 'builtins.mapAttrs (_: c: c.config.system.build.toplevel.drvPath)'
          nix eval --json --show-trace .#packages.x86_64-linux \
            --apply 'builtins.mapAttrs (_: p: p.drvPath)'

      # Evaluation alone never builds, so treefmt needs its own step.
      # It is small: alejandra and deadnix over 95 files, a few seconds.
      - name: check formatting and dead code
        run: nix build --no-link .#checks.x86_64-linux.treefmt
