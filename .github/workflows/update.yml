name: update

on:
  schedule:
    - cron: "0 4 * * 1" # core, Mondays
    - cron: "0 4 1 * *" # apps, the 1st
  workflow_dispatch:
    inputs:
      set:
        description: Which input set to bump
        type: choice
        options: [core, apps]
        default: core

permissions:
  contents: write
  pull-requests: write

jobs:
  core:
    name: core inputs
    if: inputs.set == 'core' || github.event.schedule == '0 4 * * 1'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      - uses: DeterminateSystems/update-flake-lock@v29
        with:
          inputs: nixpkgs home-manager sops-nix den flake-parts import-tree treefmt-nix nix-index-database lanzaboote
          branch: flake-lock/core
          commit-msg: "chore(flake): bump core inputs"
          pr-title: "chore(flake): bump core inputs"
          # PRs opened with GITHUB_TOKEN don't trigger check.yml, hence the PAT
          token: ${{ secrets.FLAKE_LOCK_TOKEN || github.token }}

  apps:
    name: app inputs
    if: inputs.set == 'apps' || github.event.schedule == '0 4 1 * *'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      - uses: DeterminateSystems/update-flake-lock@v29
        with:
          inputs: helix niri dms dms-plugin-registry yazi spicetify-nix stylix catppuccin wrappers cachyos-kernel batfetch nix-colors
          branch: flake-lock/apps
          commit-msg: "chore(flake): bump app inputs"
          pr-title: "chore(flake): bump app inputs"
          token: ${{ secrets.FLAKE_LOCK_TOKEN || github.token }}
